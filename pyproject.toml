[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mini_aurora"
version = "0.1.0"
description = "Scaled-down Aurora (online speculative decoding) reproduction for Apple Silicon"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mini_aurora*"]

[tool.pytest.ini_options]
testpaths = ["mini_aurora/tests"]
